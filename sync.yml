name: Canvas to Notion sync

on:
  schedule:
    # Hourly, at :10 past. The hourly cadence is what lets the 4/3/2/1-hour
    # reminders land close to their marks. Off-the-hour timing avoids GitHub's
    # busiest scheduling minute, when delayed runs are most common.
    - cron: "10 * * * *"
  workflow_dispatch:      # lets you run it manually from the Actions tab

# If a run is still going when the next hour fires, let it finish rather than
# starting a second one that would race it writing to Notion.
concurrency:
  group: canvas-notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      TIMEZONE: "America/Chicago"

      # --- Your Notion column names ---
      PROP_TITLE: "Name"
      PROP_DUE: "Due Date"
      PROP_COURSE: "Course Name"        # a relation to your Courses database
      PROP_TYPE: "Assessment Type"      # select: Final / Exam / Quiz / Assignment
      PROP_CANVAS_ID: "Canvas ID"
      PROP_REMINDERS: "Reminders Sent"
      PROP_STATUS: "Status"
      # PROP_URL: "Link"                # uncomment if you add a URL column
      # STATUS_DEFAULT: "To-Do"         # uncomment to set Status on new rows

      # Canvas only knows assignment/quiz/discussion. Map those onto the
      # options your database actually has.
      TYPE_MAP: >-
        {"assignment":"Assignment","assignment-override":"Assignment",
         "sub-assignment":"Assignment","quiz":"Quiz",
         "discussion-topic":"Assignment"}

      # Canvas reports New Quizzes as plain assignments, so the type is read
      # from the title instead. First option whose keyword appears wins, in
      # the order written here - so "Final Exam" lands on Final, not Exam.
      # Keywords match at a word start: "quiz" catches "Quizzes", "exam"
      # catches "Examen". Edit this line to retune.
      TYPE_INFER: "true"
      TYPE_KEYWORDS: '{"Final":["final"],"Exam":["exam","midterm"],"Quiz":["quiz","qotd"]}'

      # Canvas course codes -> page titles in your Courses database.
      # Keys match as a PREFIX, so "BIO 325" also catches "BIO 325-51960"
      # and keeps working when the section number changes next semester.
      # To add a course later, add another "code":"page name" pair here.
      COURSE_ALIASES: '{"CH 320M":"Organic Chemistry","BIO 325":"Genetics","SDS 320E":"Statistics"}'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull assignments from Canvas
        env:
          CANVAS_ICS_URL: ${{ secrets.CANVAS_ICS_URL }}
        run: python canvas_notion_sync.py

      # Runs even if the Canvas fetch failed, so a Canvas outage can't
      # swallow a reminder for something already in Notion.
      - name: Send due-date reminders
        if: always()
        env:
          # --- Email delivery ---
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}          # optional; defaults to SMTP_USER
          SMTP_HOST: ${{ secrets.SMTP_HOST }}        # optional; defaults to smtp.gmail.com
          SMTP_PORT: ${{ secrets.SMTP_PORT }}        # optional; defaults to 587

          # --- Phone push delivery (optional, leave unset if not using) ---
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}

          # auto = use whichever channels have credentials set.
          # Force one with "email" or "ntfy", or use both: "email,ntfy"
          REMINDER_CHANNEL: "auto"

          REMINDER_TIERS: "4,3,2,1"
          DONE_STATUSES: "Done,Complete,Completed,Submitted,Turned in"
        run: python reminders.py
